<!doctype html>
<!-- One-page A4 print view of keymap.svg (all layers). Open in a browser and print. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corne keymap</title>
<style>
  @page { size: A4 portrait; margin: 10mm; }
  html, body { margin: 0; background: #fff; }
  /* A4 printable area (210x297mm minus 10mm margins), 1mm shorter to avoid a blank 2nd page. */
  .page {
    width: 190mm;
    height: 276mm;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    break-inside: avoid;
    page-break-inside: avoid;
  }
  .page img { max-width: 100%; max-height: 100%; }
  @media screen {
    body { background: #ccc; padding: 10mm 0; }
    .page { margin: 0 auto; padding: 10mm; background: #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); }
  }
</style>
</head>
<body>
  <div class="page">
    <img src="keymap.svg" alt="Corne keymap: DEF, SYM, NAV, NUM and SYS layers">
  </div>
</body>
</html>
